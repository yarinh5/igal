<!doctype html>
<html lang="he" dir="rtl" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Yigal Group opening</title><script src="assets/hyperframe.runtime.min.js"></script><script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0909;
        --ground-warm: #171111;
        --ink: #f2eeeb;
        --muted: #756c69;
        --accent: #ef1b2d;
        --font-display: Arial, Helvetica, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        background:
          radial-gradient(circle at 50% 47%, rgba(94, 13, 19, 0.24), transparent 34%),
          var(--ground);
      }

      #loader-scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        perspective: 1500px;
        display: grid;
        place-items: center;
      }

      .ambient-field {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .ambient-field::before {
        content: "";
        position: absolute;
        inset: 10%;
        border: 1px solid rgba(239, 27, 45, 0.08);
      }

      .ambient-field::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        width: 1px;
        height: 100%;
        background: rgba(242, 238, 235, 0.055);
      }

      #drafting-lines {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      #drafting-lines path {
        fill: none;
        stroke: rgba(242, 238, 235, 0.19);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
      }

      #drafting-lines path.accent-path {
        stroke: rgba(239, 27, 45, 0.56);
        stroke-width: 2.25;
      }

      .corner-mark {
        position: absolute;
        width: 56px;
        height: 56px;
        opacity: 0.26;
      }
      .corner-mark::before,
      .corner-mark::after {
        content: "";
        position: absolute;
        background: var(--muted);
      }
      .corner-mark::before { width: 56px; height: 1px; }
      .corner-mark::after { width: 1px; height: 56px; }
      .corner-mark.tl { top: 86px; left: 86px; }
      .corner-mark.tr { top: 86px; right: 86px; transform: scaleX(-1); }
      .corner-mark.bl { bottom: 86px; left: 86px; transform: scaleY(-1); }
      .corner-mark.br { bottom: 86px; right: 86px; transform: scale(-1); }

      #brand-stage {
        position: relative;
        width: 760px;
        height: 720px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform-style: preserve-3d;
        will-change: transform, opacity;
      }

      #logo-bloom {
        position: absolute;
        top: 40px;
        left: 50%;
        width: 620px;
        height: 620px;
        margin-left: -310px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(163, 11, 24, 0.38) 0%, rgba(91, 7, 14, 0.18) 42%, transparent 72%);
        opacity: 0;
        z-index: 0;
        will-change: transform, opacity;
      }

      #logo-lockup {
        position: relative;
        width: 440px;
        height: 440px;
        z-index: 2;
        transform-style: preserve-3d;
      }

      .logo-fragment {
        position: absolute;
        inset: 0;
        width: 440px;
        height: 440px;
        background-image: url("assets/logo.webp");
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        backface-visibility: hidden;
        transform-style: preserve-3d;
        will-change: transform, opacity;
      }
      .logo-fragment:nth-child(1) { clip-path: polygon(0 0, 52% 0, 52% 52%, 0 52%); }
      .logo-fragment:nth-child(2) { clip-path: polygon(48% 0, 100% 0, 100% 52%, 48% 52%); }
      .logo-fragment:nth-child(3) { clip-path: polygon(0 48%, 52% 48%, 52% 100%, 0 100%); }
      .logo-fragment:nth-child(4) { clip-path: polygon(48% 48%, 100% 48%, 100% 100%, 48% 100%); }

      #brand-copy {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: -28px;
        direction: ltr;
      }

      #brand-name-mask {
        overflow: hidden;
        padding: 14px 24px 8px;
      }

      #brand-name {
        color: var(--ink);
        font-size: 54px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.27em;
        padding-left: 0.27em;
        opacity: 0;
        will-change: transform, opacity;
      }

      #brand-rule {
        width: 390px;
        height: 2px;
        margin-top: 22px;
        transform-origin: center;
        background: linear-gradient(90deg, transparent, var(--accent) 18%, var(--accent) 82%, transparent);
        will-change: transform, opacity;
      }

      .micro-label {
        position: absolute;
        left: 104px;
        bottom: 96px;
        color: rgba(242, 238, 235, 0.38);
        font-family: Consolas, monospace;
        font-size: 18px;
        letter-spacing: 0.22em;
        direction: ltr;
      }

      #exit-veil {
        position: absolute;
        inset: 0;
        z-index: 8;
        background: var(--ground);
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
      data-fps="60"
    >
      <section id="loader-scene">
        <div class="ambient-field" data-layout-ignore></div>
        <svg id="drafting-lines" viewBox="0 0 1920 1080" aria-hidden="true" data-layout-ignore>
          <path d="M 120 822 L 548 394 L 804 650" />
          <path d="M 1376 708 L 1628 456 L 1810 638" />
          <path d="M 268 540 L 1652 540" />
          <path d="M 960 98 L 960 982" />
          <path d="M 602 832 L 960 474 L 1318 832" />
          <path class="accent-path" d="M 770 720 L 960 530 L 1150 720" />
          <path d="M 706 188 L 1214 188" />
          <path d="M 706 892 L 1214 892" />
        </svg>
        <span class="corner-mark tl" data-layout-ignore></span>
        <span class="corner-mark tr" data-layout-ignore></span>
        <span class="corner-mark bl" data-layout-ignore></span>
        <span class="corner-mark br" data-layout-ignore></span>

        <div id="brand-stage">
          <div id="logo-bloom" data-layout-ignore></div>
          <div id="logo-lockup" aria-label="לוגו קבוצת יגאל בוחבוט">
            <div class="logo-fragment" aria-hidden="true"></div>
            <div class="logo-fragment" aria-hidden="true"></div>
            <div class="logo-fragment" aria-hidden="true"></div>
            <div class="logo-fragment" aria-hidden="true"></div>
          </div>
          <div id="brand-copy">
            <div id="brand-name-mask"><div id="brand-name" data-layout-allow-overflow>YIGAL GROUP</div></div>
            <div id="brand-rule"></div>
          </div>
        </div>

        <div class="micro-label" data-layout-ignore>YIGAL GROUP / 03.00</div>
        <div id="exit-veil" data-layout-ignore></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      const paths = Array.from(document.querySelectorAll("#drafting-lines path"));
      paths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      paths.forEach((path, index) => {
        tl.to(path, {
          strokeDashoffset: 0,
          duration: index === 5 ? 0.42 : 0.56,
          ease: index === 5 ? "power3.out" : "power2.out"
        }, 0.12 + index * 0.055);
      });

      const fragments = Array.from(document.querySelectorAll(".logo-fragment"));
      const starts = [
        { x: -210, y: -130, z: 250, rotationX: -54, rotationY: 46 },
        { x: 190, y: -150, z: -180, rotationX: 38, rotationY: -62 },
        { x: -180, y: 155, z: -240, rotationX: 62, rotationY: 34 },
        { x: 220, y: 128, z: 210, rotationX: -42, rotationY: -48 }
      ];

      fragments.forEach((fragment, index) => {
        tl.fromTo(fragment,
          { ...starts[index], opacity: 0 },
          {
            x: 0,
            y: 0,
            z: 0,
            rotationX: 0,
            rotationY: 0,
            opacity: 1,
            duration: 0.88,
            ease: index === 3 ? "back.out(1.18)" : "power4.out"
          },
          0.34 + index * 0.07
        );
      });

      tl.fromTo("#logo-bloom",
        { opacity: 0, scale: 0.82 },
        { opacity: 0.32, scale: 1, duration: 0.9, ease: "power2.out" },
        0.34
      );

      tl.set("#brand-name", { opacity: 1, y: 72 }, 0.88);
      tl.to("#brand-name", { y: 0, duration: 0.34, ease: "power4.out" }, 0.88);
      tl.fromTo("#brand-rule",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.46, ease: "expo.out" },
        1.04
      );

      tl.fromTo("#brand-stage",
        { scale: 0.985 },
        { scale: 1.018, duration: 1.08, ease: "sine.inOut" },
        1.45
      );
      tl.to("#logo-bloom", { opacity: 0.38, scale: 1.025, duration: 1.08, ease: "sine.inOut" }, 1.45);

      tl.to("#drafting-lines", { opacity: 0.24, scale: 1.025, duration: 0.38, ease: "power2.in" }, 2.52);
      tl.to("#brand-stage", { scale: 1.075, opacity: 0, duration: 0.38, ease: "power3.in" }, 2.56);
      tl.to("#exit-veil", { opacity: 1, duration: 0.32, ease: "power2.in" }, 2.68);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
